name: Build APK

# Builds an unsigned debug APK on every push or PR. The APK lands as a
# downloadable artifact attached to each Actions run (Actions tab ->
# the run -> "Artifacts" section at the bottom). Sideload to a phone:
#
#   adb install duecare-journey-debug.apk
#
# This workflow exists so you don't need a local Android Studio install
# to test the app -- push a change, wait ~6-8 minutes, download the APK.
# The first run also primes the Gradle dependency cache for subsequent
# runs (~2-3 minutes after that).

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Single space-separated string -- the v3 action passes this
          # straight to sdkmanager, which expects each package as a
          # separate arg. The pipe-multiline form gets joined into ONE
          # argument and sdkmanager rejects it as an unknown package.
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.5"
          cache-read-only: false

      - name: Show environment
        run: |
          java -version
          gradle --version
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Locate APK
        id: locate
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          echo "Found APK at $APK"
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"
          ls -la "$APK"
          # Print SHA256 so the user can verify integrity after download
          sha256sum "$APK" | tee app/build/outputs/apk/debug/duecare-journey-debug.sha256

      - name: Verify APK contains harness manifest
        env:
          APK_PATH: ${{ steps.locate.outputs.apk_path }}
        run: |
          python - <<'PY'
          import json
          import os
          import zipfile

          apk = os.environ["APK_PATH"]
          manifest_path = "assets/duecare_harness_manifest.json"

          with zipfile.ZipFile(apk) as zf:
              names = set(zf.namelist())
              if manifest_path not in names:
                  raise SystemExit(f"missing {manifest_path} in {apk}")
              data = json.loads(zf.read(manifest_path).decode("utf-8"))

          checks = [
              ("schema", data.get("schema_version") == "duecare.android.harness_manifest.v1"),
              ("version_code", data["app"]["version_code"] == 10),
              ("prompt_grep", data["active_advice_prompt_harness"]["grep_rule_count"] == 4),
              ("prompt_rag", data["active_advice_prompt_harness"]["rag_doc_count"] == 4),
              ("prompt_tools", data["active_advice_prompt_harness"]["lookup_function_count"] == 2),
              ("risk_rules", data["deterministic_domain_intelligence"]["risk_rule_count"] == 16),
              ("ilo_indicators", data["deterministic_domain_intelligence"]["ilo_indicator_count"] == 11),
              ("corridors", data["deterministic_domain_intelligence"]["corridor_profile_count"] == 20),
              ("no_telemetry", data["privacy_boundary"]["no_telemetry"] is True),
          ]
          failed = [name for name, ok in checks if not ok]
          if failed:
              raise SystemExit("manifest check failed: " + ", ".join(failed))

          print("Harness manifest verified in APK:")
          print(json.dumps({
              "version": data["app"]["version_name"],
              "advice_prompt_harness": data["active_advice_prompt_harness"],
              "domain_intelligence": data["deterministic_domain_intelligence"],
          }, indent=2))
          PY

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: duecare-journey-debug-apk
          path: |
            ${{ steps.locate.outputs.apk_path }}
            app/build/outputs/apk/debug/duecare-journey-debug.sha256
          retention-days: 30
          if-no-files-found: error

      - name: Build summary
        if: always()
        run: |
          {
            echo "## Build artifacts"
            echo ""
            echo "Download \`duecare-journey-debug-apk\` from the Artifacts"
            echo "section of this workflow run, then sideload:"
            echo ""
            echo "- Unit tests run before assemble."
            echo "- APK is verified to include \`assets/duecare_harness_manifest.json\`."
            echo "- Artifact includes the APK plus \`duecare-journey-debug.sha256\`."
            echo ""
            echo '```bash'
            echo 'unzip duecare-journey-debug-apk.zip'
            echo 'adb install app-debug.apk'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
