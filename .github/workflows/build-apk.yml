name: Build APK

# Builds an unsigned debug APK on every push or PR. The APK lands as a
# downloadable artifact attached to each Actions run (Actions tab ->
# the run -> "Artifacts" section at the bottom). Sideload to a phone:
#
#   adb install duecare-journey-debug.apk
#
# This workflow exists so you don't need a local Android Studio install
# to test the app -- push a change, wait ~6-8 minutes, download the APK.
# The first run also primes the Gradle dependency cache for subsequent
# runs (~2-3 minutes after that).

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Single space-separated string -- the v3 action passes this
          # straight to sdkmanager, which expects each package as a
          # separate arg. The pipe-multiline form gets joined into ONE
          # argument and sdkmanager rejects it as an unknown package.
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.5"
          cache-read-only: false

      - name: Show environment
        run: |
          java -version
          gradle --version
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

      - name: Run unit tests (all flavors)
        run: gradle :app:testStandardDebugUnitTest :app:testProDebugUnitTest --no-daemon --stacktrace

      - name: Assemble debug APKs (standard + pro)
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Locate and checksum APK variants
        run: |
          set -euo pipefail
          found=0
          for APK in $(find app/build/outputs/apk -name "*.apk" | sort); do
            echo "Found APK: $APK"
            ls -la "$APK"
            sha256sum "$APK" | tee "$APK.sha256"
            found=$((found+1))
          done
          if [ "$found" -eq 0 ]; then echo "no APKs found"; exit 1; fi
          echo "Total APK variants: $found"

      - name: Verify every APK variant contains the harness manifest
        run: |
          python - <<'PY'
          import glob
          import json
          import zipfile

          apks = sorted(glob.glob("app/build/outputs/apk/**/*.apk", recursive=True))
          if not apks:
              raise SystemExit("no APKs found to verify")
          manifest_path = "assets/duecare_harness_manifest.json"
          failures = []
          for apk in apks:
              with zipfile.ZipFile(apk) as zf:
                  if manifest_path not in set(zf.namelist()):
                      failures.append(f"{apk}: missing {manifest_path}")
                      continue
                  data = json.loads(zf.read(manifest_path).decode("utf-8"))
              checks = [
                  ("schema", data.get("schema_version") == "duecare.android.harness_manifest.v1"),
                  ("version_code", data["app"]["version_code"] == 11),
                  ("prompt_grep", data["active_advice_prompt_harness"]["grep_rule_count"] == 9),
                  ("prompt_rag", data["active_advice_prompt_harness"]["rag_doc_count"] == 4),
                  ("prompt_tools", data["active_advice_prompt_harness"]["lookup_function_count"] == 2),
                  ("risk_rules", data["deterministic_domain_intelligence"]["risk_rule_count"] == 16),
                  ("ilo_indicators", data["deterministic_domain_intelligence"]["ilo_indicator_count"] == 11),
                  ("corridors", data["deterministic_domain_intelligence"]["corridor_profile_count"] == 20),
                  ("no_telemetry", data["privacy_boundary"]["no_telemetry"] is True),
              ]
              bad = [name for name, ok in checks if not ok]
              if bad:
                  failures.append(f"{apk}: " + ", ".join(bad))
              else:
                  print(f"OK  {apk}  (versionName {data['app']['version_name']})")
          if failures:
              raise SystemExit("manifest verification failed:\n  " + "\n  ".join(failures))
          print(f"\nAll {len(apks)} APK variant(s) verified.")
          PY

      - name: Upload APK artifacts (standard + pro)
        uses: actions/upload-artifact@v4
        with:
          name: duecare-journey-debug-apks
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/outputs/apk/**/*.sha256
          retention-days: 30
          if-no-files-found: error

      - name: Build summary
        if: always()
        run: |
          {
            echo "## Build artifacts"
            echo ""
            echo "Download \`duecare-journey-debug-apks\` from the Artifacts"
            echo "section of this workflow run. It contains TWO variants:"
            echo ""
            echo "- \`app-standard-debug.apk\` — Gemma 4 E2B default (~2 GB, mainstream devices)."
            echo "- \`app-pro-debug.apk\` — Gemma 4 E4B default (~3.5 GB, 6 GB+ RAM devices);"
            echo "  installs side-by-side as \`com.duecare.journey.pro\`."
            echo ""
            echo "- Unit tests run before assemble (both flavors)."
            echo "- Every APK is verified to include \`assets/duecare_harness_manifest.json\`."
            echo "- Each APK ships with a \`.sha256\` for integrity."
            echo ""
            echo '```bash'
            echo '# pick the variant for your device tier, then:'
            echo 'adb install app-standard-debug.apk   # or app-pro-debug.apk'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
